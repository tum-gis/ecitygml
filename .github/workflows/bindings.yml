name: Bindings

# Checks that the committed bindings are up to date, then builds and tests the bindings of every language, using the
# same mise tasks as the GitLab CI (.gitlab-ci.yml). mise installs the per-task tools (CMake, JDK, Gradle, Node, .NET).
# The public repository takes all dependencies from crates.io, so no secrets are needed.

on:
  push:
    branches:
    - main
    - develop
  pull_request: {}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  MISE_VERSION: 2026.10.4

jobs:

  # The bindings are committed; this is the only job that needs diplomat-tool.
  check-bindings:
    name: Check bindings
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: cargo-bins/cargo-binstall@main
    - uses: jdx/mise-action@v3
      with:
        version: ${{ env.MISE_VERSION }}
    - run: mise run init-build-environment
    - run: mise run check-bindings   # mise installs diplomat-tool (task `tools`)

  test-bindings:
    name: Test ${{ matrix.language }} bindings
    needs: check-bindings   # build only from up-to-date bindings
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [c, cpp, python, kotlin, typescript, dotnet]
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    steps:
    - uses: actions/checkout@v6
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
      with:
        key: bindings-${{ matrix.language }}
    - uses: cargo-bins/cargo-binstall@main
    - uses: jdx/mise-action@v3
      with:
        version: ${{ env.MISE_VERSION }}
    - name: Set up the build environment
      # Python needs uv and a venv with pytest (its init task also runs init-build-environment).
      run: |
        if [ "${{ matrix.language }}" = python ]; then
          mise run init-build-bindings-python-environment
        else
          mise run init-build-environment
        fi
    - run: mise run build-bindings-${{ matrix.language }}
    - run: mise run test-bindings-${{ matrix.language }}
