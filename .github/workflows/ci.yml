name: CI

# Runs the same mise tasks as the GitLab CI (.gitlab-ci.yml), which also install the toolchain declared in mise.toml.

on:
  push:
    branches:
    - main
  pull_request:
  # Called by the release workflow, which only releases tags that pass
  workflow_call:

permissions:
  contents: read

# Cancel outdated runs of the same pull request or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MISE_VERSION: 2026.10.4
  # No debug info: smaller target directory (cache) and faster builds
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

jobs:

  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v5
      with:
        version: ${{ env.MISE_VERSION }}
    - uses: Swatinem/rust-cache@v2
    - run: mise run check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: jdx/mise-action@v5
      with:
        version: ${{ env.MISE_VERSION }}
    - uses: Swatinem/rust-cache@v2
    - run: mise run build
    - run: mise run test
