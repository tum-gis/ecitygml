min_version = "2026.9.0"

[tools]
rust = { version = "stable", profile = "minimal", components = "rustfmt,clippy", targets = "wasm32-unknown-unknown" }

# --- Entry points ---

[tasks.default]
description = "Check, build, test and document the Rust workspace"
run = [
	{ task = "check" },
	{ task = "build" },
	{ task = "test" },
	{ task = "doc" },
]

[tasks.full]
description = "Check, build and test everything: the Rust workspace and the web viewer, then generate, build and test all bindings"
run = '''
mise run check
mise run build
mise run test
mise run build:gui-web
mise run generate:bindings
mise run --jobs 1 'test:bindings:*'
'''

# --- Code quality ---

[tasks.check]
description = "Run all read-only checks (formatting, clippy for native and WebAssembly, documentation)"
depends = ["check:fmt", "check:clippy", "check:wasm", "check:doc"]

[tasks."check:fmt"]
description = "Check the formatting"
run = "cargo fmt --all -- --check"

[tasks."check:clippy"]
description = "Lint the workspace with clippy"
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."check:wasm"]
description = "Lint the workspace with clippy for WebAssembly (covers the cfg(target_arch = \"wasm32\") code)"
run = "cargo clippy --workspace --all-targets --target wasm32-unknown-unknown -- -D warnings"

[tasks."check:doc"]
description = "Check the documentation (broken intra-doc links, invalid HTML)"
env = { RUSTDOCFLAGS = "-D warnings" }
run = "cargo doc --no-deps --all-features"

[tasks.fix]
description = "Apply compiler and clippy fixes and format the code (rewrites files; see check for the read-only variant)"
alias = "lint"
run = '''
cargo fix --workspace --all-targets --all-features --allow-dirty
cargo clippy --workspace --all-targets --all-features --fix --allow-dirty --allow-staged
cargo fmt --all
'''

# --- Build, test and documentation ---

[tasks.build]
description = "Build the project"
usage = '''
flag "-r --release" help="Build artifacts in release mode, with optimizations"
'''

run = '''
if [ "${usage_release}" = 'true' ]; then
    cargo build --release;
else
    cargo build;
fi
'''

[tasks."build:gui-web"]
description = "Build the web version of the viewer (static files in target/gui-web, e.g. for hosting)"
tools = { "github:trunk-rs/trunk" = "0.21.14" }
dir = "crates/ecitygml-gui"
# The 32 MiB stack is set in .cargo/config.toml.
run = '''
trunk build --release
'''

[tasks.test]
description = "Run the unit and integration tests"
run = "cargo test --workspace --all-features"

[tasks.doc]
description = "Build the documentation"
run = '''
cargo doc --no-deps --all-features
echo '<meta http-equiv="refresh" content="0; url=ecitygml/index.html">' > target/doc/index.html
'''

# --- Run and serve ---

[tasks."run:cli"]
description = "Run the CLI (arguments are passed through, e.g. mise run run:cli -- --help)"
run = "cargo run -p ecitygml-cli --"

[tasks."run:gui"]
description = "Run the native viewer"
run = "cargo run -p ecitygml-gui"

[tasks."serve:doc"]
description = "Serve the documentation on a local web server"
depends = ["doc"]
tools = { "cargo:miniserve" = "0" }
run = '''
miniserve ./target/doc --index index.html
'''

[tasks."serve:gui-web"]
description = "Serve the web version of the viewer on http://127.0.0.1:8080 and open it, rebuilding on changes"
usage = '''
flag "-r --release" help="Build in release mode, with optimizations (slower rebuilds, faster viewer)"
'''
tools = { "github:trunk-rs/trunk" = "0.21.14" }
dir = "crates/ecitygml-gui"
# Own dist directory: target/gui-web stays the release build of build:gui-web.
run = '''
if [ "${usage_release}" = 'true' ]; then
    trunk serve --release --dist ../../target/gui-web-serve;
else
    trunk serve --dist ../../target/gui-web-serve;
fi
'''

# --- Bindings ---

[tasks."generate:bindings"]
description = "Generate the bindings of all languages from the Diplomat bridges in ecitygml-ffi"
tools = { "cargo:diplomat-tool" = "0.16.1" }
dir = "crates/ecitygml-ffi"
run = '''
rm -rf bindings/c/include bindings/cpp/include bindings/python/src bindings/kotlin/src/main bindings/typescript/lib bindings/dotnet/src
diplomat-tool --silent c bindings/c/include
diplomat-tool --silent cpp bindings/cpp/include
diplomat-tool --silent nanobind bindings/python/src
diplomat-tool --silent kotlin bindings/kotlin
diplomat-tool --silent js bindings/typescript/lib
diplomat-tool --silent dotnet bindings/dotnet/src
'''

[tasks."check:bindings"]
description = "Fail if the committed bindings are out of date with the Diplomat bridges"
depends = "generate:bindings"
run = '''
# Changed and new (untracked) files, without touching the Git index.
changes="$(git status --porcelain -- crates/ecitygml-ffi/bindings)"
if [ -n "$changes" ]; then
    echo "$changes"
    echo "Bindings are out of date: run 'mise run generate:bindings' and commit the result."
    exit 1
fi
'''

[tasks."build:bindings:c"]
description = "Build the C unit tests and examples against the C bindings (committed headers, see check:bindings)"
# mise installs CMake on demand (e.g. in CI)
tools = { cmake = "4" }
run = '''
cargo build -p ecitygml-ffi
cmake -S crates/ecitygml-ffi/bindings/c -B target/bindings-c -DCMAKE_BUILD_TYPE=Debug
cmake --build target/bindings-c
'''

[tasks."test:bindings:c"]
description = "Test the C bindings: unit tests and examples on fixtures (CTest)"
depends = "build:bindings:c"
tools = { cmake = "4" }
run = '''
ctest --test-dir target/bindings-c --output-on-failure
'''

[tasks."build:bindings:cpp"]
description = "Build the C++ unit tests and examples against the C++ bindings (committed headers, see check:bindings)"
# mise installs CMake on demand (e.g. in CI); the unit tests fetch Catch2 when configuring
tools = { cmake = "4" }
run = '''
cargo build -p ecitygml-ffi
cmake -S crates/ecitygml-ffi/bindings/cpp -B target/bindings-cpp -DCMAKE_BUILD_TYPE=Debug
cmake --build target/bindings-cpp
'''

[tasks."test:bindings:cpp"]
description = "Test the C++ bindings: unit tests (Catch2) and examples on fixtures (CTest)"
depends = "build:bindings:cpp"
tools = { cmake = "4" }
run = '''
ctest --test-dir target/bindings-cpp --output-on-failure
'''

[tasks."setup:bindings:python"]
description = "Set up the environment for building the Python bindings (venv with pytest)"
tools = { uv = "latest" }
dir = "crates/ecitygml-ffi/bindings/python"
run = '''
# uv-managed Python: ships the headers nanobind needs (Debian's system Python doesn't)
uv venv --clear --managed-python --python 3.13 .venv
uv pip install --python .venv pytest
'''

[tasks."build:bindings:python"]
description = "Build the Python bindings (nanobind, statically linked) into the venv (see setup:bindings:python)"
tools = { uv = "latest" }
run = '''
cargo build -p ecitygml-ffi --release
uv pip install --python crates/ecitygml-ffi/bindings/python/.venv --reinstall ./crates/ecitygml-ffi/bindings/python
'''

[tasks."test:bindings:python"]
description = "Test the Python bindings (pytest)"
depends = "build:bindings:python"
dir = "crates/ecitygml-ffi/bindings/python"
run = '''
.venv/bin/python -m pytest tests
'''

[tasks."build:bindings:kotlin"]
description = "Build the Kotlin bindings (committed sources, see check:bindings)"
# mise installs these on demand (e.g. in CI)
tools = { java = "openjdk-21", gradle = "9.8.0" }
run = '''
cargo build -p ecitygml-ffi
gradle --project-dir crates/ecitygml-ffi/bindings/kotlin build -x test
'''

[tasks."test:bindings:kotlin"]
description = "Test the Kotlin bindings (JUnit; loads target/debug/libecitygml_ffi via JNA)"
depends = "build:bindings:kotlin"
tools = { java = "openjdk-21", gradle = "9.8.0" }
run = '''
gradle --project-dir crates/ecitygml-ffi/bindings/kotlin test
'''

[tasks."build:bindings:typescript"]
description = "Build the WebAssembly module for the TypeScript bindings (committed sources, see check:bindings)"
tools = { node = "22" }
run = '''
# Pure Rust: the FFI crate builds without the `zstd` feature (C code) for WebAssembly.
# The 32 MiB stack is set in .cargo/config.toml.
cargo build -p ecitygml-ffi --release --target wasm32-unknown-unknown
'''

[tasks."test:bindings:typescript"]
description = "Test the TypeScript bindings (Node >= 22.18 runs the .ts tests directly)"
depends = "build:bindings:typescript"
tools = { node = "22" }
dir = "crates/ecitygml-ffi/bindings/typescript"
run = '''
node --test
'''

[tasks."build:bindings:dotnet"]
description = "Build the C# (.NET) bindings and their tests (committed sources, see check:bindings)"
tools = { dotnet = "10" }
run = '''
cargo build -p ecitygml-ffi
dotnet build crates/ecitygml-ffi/bindings/dotnet/tests/Ecitygml.Tests.csproj -nologo
'''

[tasks."test:bindings:dotnet"]
description = "Test the C# (.NET) bindings (xUnit; loads target/debug/libecitygml_ffi)"
depends = "build:bindings:dotnet"
tools = { dotnet = "10" }
run = '''
dotnet test crates/ecitygml-ffi/bindings/dotnet/tests/Ecitygml.Tests.csproj -nologo
'''

# --- Maintenance ---

[tasks.clean]
description = "Remove generated artifacts"
run = "cargo clean"

[tasks.release]
description = "Create a new software release and publish it"
usage = '''
arg "<level>" help="Either bump by LEVEL or set the VERSION for all selected packages" {
  choices "major" "minor" "patch" "release" "rc" "beta" "alpha"
}
arg "<registry>" help="Name of the Cargo registry to publish to, e.g. crates-io"
'''
tools = { "cargo:cargo-release" = "1" }
run = '''
cargo release ${usage_level?} --registry "${usage_registry?}" --workspace --no-tag --execute
'''
