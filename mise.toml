min_version = "2026.9.0"

[tasks.default]
run = ['mise run lint', 'mise run build', 'mise run test', 'mise run doc']


[tasks.full]
description = "Build and test everything: the Rust workspace, then generate, build and test all bindings"
run = '''
mise run build
mise run test
mise run generate-bindings
mise run build-bindings-c
mise run test-bindings-c
mise run build-bindings-cpp
mise run test-bindings-cpp
mise run build-bindings-python
mise run test-bindings-python
mise run build-bindings-kotlin
mise run test-bindings-kotlin
mise run build-bindings-typescript
mise run test-bindings-typescript
mise run build-bindings-dotnet
mise run test-bindings-dotnet
'''


[tasks.init-build-environment]
description = "Set up the build environment"
run = '''
rustup component add rustfmt clippy
'''

[tasks.init-build-bindings-python-environment]
description = "Set up the environment for building the Python bindings (venv with pytest)"
depends = "init-build-environment"
tools = { uv = "latest" }
dir = "crates/ecitygml-ffi/bindings/python"
run = '''
# uv-managed Python: ships the headers nanobind needs (Debian's system Python doesn't)
uv venv --clear --managed-python --python 3.13 .venv
uv pip install --python .venv pytest
'''

[tasks.lint]
description = "Format and lint the project"
run = '''
cargo fix --allow-dirty
cargo clippy --fix --allow-dirty --allow-staged
cargo fmt --all
'''

[tasks.build]
description = "Compile the project"
usage = '''
flag "-r --release" help="Build artifacts in release mode, with optimizations"
'''

run = '''
if [ "${usage_release}" = 'true' ]; then
    cargo build --release;
else
    cargo build;
fi
'''

[tasks.generate-bindings]
description = "Generate the bindings of all languages from the Diplomat bridges in ecitygml-ffi"
tools = { "cargo:diplomat-tool" = "0.16.1" }
dir = "crates/ecitygml-ffi"
run = '''
rm -rf bindings/c/include bindings/cpp/include bindings/python/src bindings/kotlin/src/main bindings/typescript/lib bindings/dotnet/src
diplomat-tool --silent c bindings/c/include
diplomat-tool --silent cpp bindings/cpp/include
diplomat-tool --silent nanobind bindings/python/src
diplomat-tool --silent kotlin bindings/kotlin
diplomat-tool --silent js bindings/typescript/lib
diplomat-tool --silent dotnet bindings/dotnet/src
'''

[tasks.check-bindings]
description = "Fail if the committed bindings are out of date with the Diplomat bridges"
depends = "generate-bindings"
run = '''
# Changed and new (untracked) files, without touching the Git index.
changes="$(git status --porcelain -- crates/ecitygml-ffi/bindings)"
if [ -n "$changes" ]; then
    echo "$changes"
    echo "Bindings are out of date: run 'mise run generate-bindings' and commit the result."
    exit 1
fi
'''

[tasks.build-bindings-c]
description = "Compile the C examples against the C bindings (committed headers, see check-bindings)"
# mise installs CMake on demand (e.g. in CI)
tools = { cmake = "4" }
run = '''
cargo build -p ecitygml-ffi
cmake -S crates/ecitygml-ffi/bindings/c -B target/bindings-c -DCMAKE_BUILD_TYPE=Debug
cmake --build target/bindings-c
'''

[tasks.build-bindings-cpp]
description = "Compile the C++ unit tests and examples against the C++ bindings (committed headers, see check-bindings)"
# mise installs CMake on demand (e.g. in CI); the unit tests fetch Catch2 when configuring
tools = { cmake = "4" }
run = '''
cargo build -p ecitygml-ffi
cmake -S crates/ecitygml-ffi/bindings/cpp -B target/bindings-cpp -DCMAKE_BUILD_TYPE=Debug
cmake --build target/bindings-cpp
'''

[tasks.build-bindings-kotlin]
description = "Compile the Kotlin bindings (committed sources, see check-bindings)"
# mise installs these on demand (e.g. in CI)
tools = { java = "openjdk-21", gradle = "9.8.0" }
run = '''
cargo build -p ecitygml-ffi
gradle --project-dir crates/ecitygml-ffi/bindings/kotlin build -x test
'''

[tasks.build-bindings-typescript]
description = "Compile the WebAssembly module for the TypeScript bindings (committed sources, see check-bindings)"
tools = { node = "22" }
run = '''
rustup target add wasm32-unknown-unknown
# Pure Rust: the FFI crate builds without the `zstd` feature (C code) for WebAssembly.
# 32 MiB stack: the deserializer runs on the main thread in WebAssembly (as big as the native workers' stacks)
RUSTFLAGS="-C link-arg=-zstack-size=33554432" cargo build -p ecitygml-ffi --release --target wasm32-unknown-unknown
'''

[tasks.build-bindings-python]
description = "Compile the Python bindings (nanobind, statically linked) into the venv"
tools = { uv = "latest" }
run = '''
cargo build -p ecitygml-ffi --release
uv pip install --python crates/ecitygml-ffi/bindings/python/.venv --reinstall ./crates/ecitygml-ffi/bindings/python
'''

[tasks.test]
description = "Execute unit and integration tests"
run = '''
cargo fmt --all -- --check
cargo clippy
cargo test --verbose --all-features
'''

[tasks.test-bindings-c]
description = "Run the C examples on fixtures (CTest)"
tools = { cmake = "4" }
run = '''
ctest --test-dir target/bindings-c --output-on-failure
'''

[tasks.test-bindings-cpp]
description = "Run the C++ unit tests (Catch2) and examples on fixtures (CTest)"
tools = { cmake = "4" }
run = '''
ctest --test-dir target/bindings-cpp --output-on-failure
'''

[tasks.test-bindings-kotlin]
description = "Execute the tests of the Kotlin bindings (loads target/debug/libecitygml_ffi via JNA)"
tools = { java = "openjdk-21", gradle = "9.8.0" }
run = '''
gradle --project-dir crates/ecitygml-ffi/bindings/kotlin test
'''

[tasks.test-bindings-typescript]
description = "Execute the tests of the TypeScript bindings (Node >= 22.18 runs the .ts tests directly)"
tools = { node = "22" }
dir = "crates/ecitygml-ffi/bindings/typescript"
run = '''
node --test
'''

[tasks.build-bindings-dotnet]
description = "Compile the C# (.NET) bindings and their tests (committed sources, see check-bindings)"
tools = { dotnet = "10" }
run = '''
cargo build -p ecitygml-ffi
dotnet build crates/ecitygml-ffi/bindings/dotnet/tests/Ecitygml.Tests.csproj -nologo
'''

[tasks.test-bindings-dotnet]
description = "Execute the tests of the C# (.NET) bindings (xUnit; loads target/debug/libecitygml_ffi)"
tools = { dotnet = "10" }
run = '''
dotnet test crates/ecitygml-ffi/bindings/dotnet/tests/Ecitygml.Tests.csproj -nologo
'''


[tasks.test-bindings-python]
description = "Execute the tests of the Python bindings"
dir = "crates/ecitygml-ffi/bindings/python"
run = '''
.venv/bin/python -m pytest tests
'''

[tasks.run]
description = "Run the project"
run = "cargo run"

[tasks.clean]
description = "Remove generated artifacts"
run = "cargo clean"

[tasks.doc]
description = "Build the documentation"
run = '''
cargo doc --no-deps --all-features
echo '<meta http-equiv="refresh" content="0; url=ecitygml/index.html">' > target/doc/index.html
'''

[tasks.serve-doc]
description = "Start a local webserver with the documentation"
depends = ["doc"]
tools = { "cargo:miniserve" = "0" }
run = '''
miniserve ./target/doc --index index.html
'''

[tasks.release]
description = "Create a new software release and publish it"
usage = '''
arg "<level>" help="Either bump by LEVEL or set the VERSION for all selected packages" {
  choices "major" "minor" "patch" "release" "rc" "beta" "alpha"
}
arg "<registry>" help="Name of the Cargo registry to publish to, e.g. crates-io"
'''
tools = { "cargo:cargo-release" = "1" }
run = '''
cargo release ${usage_level?} --registry "${usage_registry?}" --workspace --no-tag --execute
'''
